<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdgeGuard Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <h1>EdgeGuard</h1>
            <p class="subtitle">Edge security monitoring dashboard</p>
        </div>
        <div class="header-actions">
            <button id="analyzeBtn" class="btn btn-primary">Run Analysis</button>
            <button id="refreshBtn" class="btn btn-secondary">Refresh</button>
        </div>
    </header>

    <main class="main">
        <section class="stats-grid" id="statsGrid">
            <div class="stat-card"><span class="stat-label">Total Events</span><span class="stat-value" id="totalEvents">—</span></div>
            <div class="stat-card"><span class="stat-label">Events (1h)</span><span class="stat-value" id="eventsLastHour">—</span></div>
            <div class="stat-card alert-stat"><span class="stat-label">Active Alerts</span><span class="stat-value" id="unresolvedAlerts">—</span></div>
            <div class="stat-card"><span class="stat-label">Total Alerts</span><span class="stat-value" id="totalAlerts">—</span></div>
        </section>

        <section class="panel">
            <h2>Event Trends (24h)</h2>
            <div class="chart-wrap">
                <canvas id="trendsChart"></canvas>
            </div>
        </section>

        <div class="two-col">
            <section class="panel">
                <h2>Alerts</h2>
                <div id="alertsList" class="alerts-list">
                    <p class="empty">No alerts yet. Ingest events and run analysis.</p>
                </div>
            </section>

            <section class="panel">
                <h2>Top Sources</h2>
                <div id="topSources" class="top-list"></div>
                <h2 class="section-sub">Event Types</h2>
                <div id="topTypes" class="top-list"></div>
            </section>
        </div>

        <section class="panel">
            <h2>Recent Events</h2>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Type</th>
                            <th>IP</th>
                            <th>Severity</th>
                            <th>Message</th>
                        </tr>
                    </thead>
                    <tbody id="eventsTable">
                        <tr><td colspan="5" class="empty">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
</body>
</html>
